
name: Build Restaurant POS Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "restaurant_pos_phase6_github_actions_windows_build.zip" -DestinationPath "source" -Force

      - name: Install dependencies
        working-directory: source/restaurant_pos_starter/admin
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        working-directory: source/restaurant_pos_starter/admin
        run: npm run desktop:dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-POS-Windows-Installer
          path: source/restaurant_pos_starter/admin/release/*.exe
          if-no-files-found: error
          retention-days: 14
